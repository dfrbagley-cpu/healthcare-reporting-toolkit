name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  EDGE_CONTRACT_RELEASE: https://github.com/dfrbagley-cpu/health-data-edge-cases/releases/tag/v0.2.0
  EDGE_CONTRACT_URL: https://raw.githubusercontent.com/dfrbagley-cpu/health-data-edge-cases/v0.2.0/docs/contracts/catalog-v1.json

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run deterministic validation
        run: npm run validate

      - name: Verify pinned edge-suite release catalog
        if: matrix.node-version == 24
        env:
          CATALOG_PATH: ${{ runner.temp }}/health-data-edge-cases-v0.2.0-catalog.json
        run: |
          set -euo pipefail
          echo "Verifying catalog published by $EDGE_CONTRACT_RELEASE"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --silent \
            --show-error \
            --tlsv1.2 \
            --output "$CATALOG_PATH" \
            "$EDGE_CONTRACT_URL"
          node scripts/vendor-edge-contract.mjs --check "$CATALOG_PATH"
