<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2838"/>
      <stop offset="1" stop-color="#153d4e"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#2a8f80" stop-opacity=".7"/>
      <stop offset="1" stop-color="#2a8f80" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1050" cy="70" r="330" fill="url(#glow)"/>
  <circle cx="1150" cy="610" r="250" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="1150" cy="610" r="170" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="2"/>

  <g transform="translate(72 70)">
    <rect width="62" height="62" rx="14" fill="#bfe1d8"/>
    <text x="31" y="40" fill="#0b2838" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">HR</text>
    <text x="82" y="25" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Healthcare Reporting</text>
    <text x="82" y="51" fill="#bcd0d7" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="2">OPEN TOOLKIT</text>
  </g>

  <g transform="translate(72 205)">
    <text fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="700">
      <tspan x="0" y="0">Make reporting logic</tspan>
      <tspan x="0" y="78">easier to check.</tspan>
    </text>
    <text x="0" y="137" fill="#c9d8dd" font-family="Arial, Helvetica, sans-serif" font-size="25">
      Visible inputs. Stated assumptions. Exportable results.
    </text>
  </g>

  <g transform="translate(72 485)" font-family="Arial, Helvetica, sans-serif">
    <g>
      <rect width="290" height="74" rx="12" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".15"/>
      <text x="22" y="31" fill="#8bd2c2" font-size="15" font-weight="700" letter-spacing="1.5">01 · PERIODS</text>
      <text x="22" y="55" fill="#ffffff" font-size="18">Align reporting windows</text>
    </g>
    <g transform="translate(310)">
      <rect width="290" height="74" rx="12" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".15"/>
      <text x="22" y="31" fill="#8bd2c2" font-size="15" font-weight="700" letter-spacing="1.5">02 · EXTRACTS</text>
      <text x="22" y="55" fill="#ffffff" font-size="18">Audit CSV changes</text>
    </g>
    <g transform="translate(620)">
      <rect width="290" height="74" rx="12" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".15"/>
      <text x="22" y="31" fill="#8bd2c2" font-size="15" font-weight="700" letter-spacing="1.5">03 · CAPACITY</text>
      <text x="22" y="55" fill="#ffffff" font-size="18">Test waitlist scenarios</text>
    </g>
  </g>

  <text x="1128" y="594" fill="#aac1c8" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="end">
    Runs locally in the browser
  </text>
