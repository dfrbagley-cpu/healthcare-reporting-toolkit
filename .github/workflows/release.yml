name: Release validated version

on:
  workflow_run:
    workflows: ["Quality gates"]
    branches: [main]
    types: [completed]

permissions: {}

concurrency:
  group: validated-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      current: ${{ steps.head.outputs.current }}
      sha: ${{ steps.head.outputs.sha }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Reject stale workflow runs
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          printf 'sha=%s\n' "$VALIDATED_SHA" >> "$GITHUB_OUTPUT"

          if [[ "$main_sha" != "$VALIDATED_SHA" ]]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale validated commit $VALIDATED_SHA; main is $main_sha."
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out exact validated commit
        if: steps.head.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        if: steps.head.outputs.current == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Read and validate version
        if: steps.head.outputs.current == 'true'
        id: version
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"

          node <<'JS'
          const fs = require("node:fs");
          const { version } = JSON.parse(fs.readFileSync("package.json", "utf8"));

          const semver =
            /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:(?:0|[1-9]\d*)|(?:\d*[A-Za-z-][0-9A-Za-z-]*))(?:\.(?:(?:0|[1-9]\d*)|(?:\d*[A-Za-z-][0-9A-Za-z-]*)))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;

          if (typeof version !== "string" || !semver.test(version)) {
            throw new Error(`Invalid SemVer in package.json: ${JSON.stringify(version)}`);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          JS

  release:
    needs: prepare
    if: >-
      ${{
        needs.prepare.result == 'success' &&
        needs.prepare.outputs.current == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      VALIDATED_SHA: ${{ needs.prepare.outputs.sha }}
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Create tag and release idempotently
        run: |
          set -euo pipefail

          TAG="v$VERSION"
          [[ "$TAG" =~ ^v[0-9A-Za-z.+-]+$ ]] || {
            echo "::error::Unsafe tag value."
            exit 1
          }

          main_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" == "$VALIDATED_SHA" ]] || {
            echo "::notice::Main advanced after validation; no release created."
            exit 0
          }

          ref_error="$RUNNER_TEMP/ref-lookup.err"
          if gh api "repos/$REPOSITORY/git/ref/tags/$TAG" \
              >/dev/null 2>"$ref_error"; then
            tag_sha="$(gh api "repos/$REPOSITORY/commits/$TAG" --jq '.sha')"
            [[ "$tag_sha" == "$VALIDATED_SHA" ]] || {
              echo "::error::$TAG already points to $tag_sha, not $VALIDATED_SHA."
              exit 1
            }
          elif grep -q 'HTTP 404' "$ref_error"; then
            gh api --method POST "repos/$REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$VALIDATED_SHA" >/dev/null
          else
            cat "$ref_error" >&2
            exit 1
          fi

          release_error="$RUNNER_TEMP/release-lookup.err"
          if gh api "repos/$REPOSITORY/releases/tags/$TAG" \
              >/dev/null 2>"$release_error"; then
            echo "::notice::Release $TAG already exists at the validated tag; nothing to do."
            exit 0
          elif ! grep -q 'HTTP 404' "$release_error"; then
            cat "$release_error" >&2
            exit 1
          fi

          gh api --method POST "repos/$REPOSITORY/releases" \
            -f tag_name="$TAG" \
            -f target_commitish="$VALIDATED_SHA" \
            -f name="$TAG" \
            -F generate_release_notes=true \
            -F draft=false >/dev/null

          tag_sha="$(gh api "repos/$REPOSITORY/commits/$TAG" --jq '.sha')"
          test "$tag_sha" = "$VALIDATED_SHA"
