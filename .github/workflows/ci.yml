name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  EDGE_CONTRACT_RELEASE: https://github.com/dfrbagley-cpu/health-data-edge-cases/releases/tag/v0.4.0
  EDGE_CONTRACT_URL: https://raw.githubusercontent.com/dfrbagley-cpu/health-data-edge-cases/v0.4.0/docs/contracts/catalog-v1.json

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pinned validation dependency
        run: npm ci --ignore-scripts

      - name: Run deterministic validation
        run: npm run validate

      - name: Require a version bump for deployable site changes
        if: matrix.node-version == 24
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tag="v$version"
          provenance_name="healthcare-reporting-toolkit-v$version-provenance.json"

          release_ids="$(
            gh api --paginate "repos/$REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$tag\") | .id"
          )"
          release_count=0
          if [[ -n "$release_ids" ]]; then
            release_count="$(wc -l <<< "$release_ids")"
          fi
          [[ "$release_count" -le 1 ]] || {
            echo "::error::Multiple releases use $tag; deployable identity is ambiguous."
            exit 1
          }

          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$tag" \
            > "$RUNNER_TEMP/release-tag-ref"
          tag_status=$?
          set -e
          if [[ "$tag_status" -eq 0 ]]; then
            git fetch --force --no-tags --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          elif [[ "$tag_status" -ne 2 ]]; then
            echo "::error::Could not determine whether release tag $tag exists."
            exit "$tag_status"
          fi

          anchor_commit=""
          if [[ "$release_count" -eq 1 ]]; then
            release_id="$release_ids"
            release_draft="$(
              gh api "repos/$REPOSITORY/releases/$release_id" --jq '.draft'
            )"
            if [[ "$release_draft" == "false" ]]; then
              [[ "$tag_status" -eq 0 ]] || {
                echo "::error::Published release $tag has no matching tag."
                exit 1
              }
              release_target="$(
                gh api "repos/$REPOSITORY/releases/$release_id" --jq '.target_commitish'
              )"
              test -n "$release_target"
              release_target_sha="$(
                gh api "repos/$REPOSITORY/commits/$release_target" --jq '.sha'
              )"
              release_immutable="$(
                gh api "repos/$REPOSITORY/releases/$release_id" --jq '.immutable'
              )"
              if [[ "$release_immutable" != "true" ]]; then
                echo "::notice::GitHub release immutability is recommended for $tag; provenance and tag agreement remain mandatory."
              fi
              asset_names="$(
                gh api "repos/$REPOSITORY/releases/$release_id/assets?per_page=100" \
                  --jq '.[].name' | sort
              )"
              expected_assets="$(
                printf '%s\n' SHA256SUMS "$provenance_name" \
                  "healthcare-reporting-toolkit-v$version.zip" | sort
              )"
              [[ "$asset_names" == "$expected_assets" ]] || {
                echo "::error::Published release $tag does not have the exact operational asset set."
                exit 1
              }
              provenance_asset_id="$(
                gh api "repos/$REPOSITORY/releases/$release_id/assets?per_page=100" \
                  --jq ".[] | select(.name == \"$provenance_name\") | .id"
              )"
              test -n "$provenance_asset_id"
              gh api \
                -H 'Accept: application/octet-stream' \
                "repos/$REPOSITORY/releases/assets/$provenance_asset_id" \
                > "$RUNNER_TEMP/release-provenance.json"
              anchor_commit="$(
                node --input-type=module - \
                  "$RUNNER_TEMP/release-provenance.json" \
                  "$GITHUB_SERVER_URL/$REPOSITORY" "$version" <<'JS'
          import { readFileSync } from "node:fs";

          const [path, repository, version] = process.argv.slice(2);
          const provenance = JSON.parse(readFileSync(path, "utf8"));
          const commit = provenance.source?.commit;
          if (
            provenance.source?.repository !== repository ||
            provenance.version !== version ||
            typeof commit !== "string" ||
            !/^[0-9a-f]{40}$/.test(commit)
          ) {
            throw new Error("Published provenance has an invalid source identity.");
          }
          process.stdout.write(commit);
          JS
              )"
              tag_commit="$(git rev-list -n 1 "$tag")"
              [[ "$tag_commit" == "$anchor_commit" ]] || {
                echo "::error::Published provenance and $tag resolve to different commits."
                exit 1
              }
              [[ "$release_target_sha" == "$anchor_commit" ]] || {
                echo "::error::Published release target and provenance resolve to different commits."
                exit 1
              }
            fi
          fi

          if [[ -z "$anchor_commit" && "$tag_status" -eq 0 ]]; then
            anchor_commit="$(git rev-list -n 1 "$tag")"
          fi
          if [[ -n "$anchor_commit" ]] && \
              ! git diff --quiet "$anchor_commit" HEAD -- site; then
            echo "::error::Deployable site files changed after $tag. Bump the toolkit version."
            exit 1
          fi

      - name: Verify pinned edge-suite release catalog
        if: matrix.node-version == 24
        env:
          CATALOG_PATH: ${{ runner.temp }}/health-data-edge-cases-v0.4.0-catalog.json
        run: |
          set -euo pipefail
          echo "Verifying catalog published by $EDGE_CONTRACT_RELEASE"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --silent \
            --show-error \
            --tlsv1.2 \
            --output "$CATALOG_PATH" \
            "$EDGE_CONTRACT_URL"
          node scripts/vendor-edge-contract.mjs --check "$CATALOG_PATH"

  browser-auditor:
    name: Chrome 100,000-row extract audit, tool journeys, and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pinned browser-test dependency
        run: npm ci --ignore-scripts

      - name: Run production-site journeys and accessibility gate
        shell: bash
        run: |
          set -euo pipefail
          chrome_path="$(
            command -v google-chrome ||
            command -v google-chrome-stable ||
            true
          )"
          test -n "$chrome_path"
          "$chrome_path" --version
          CHROME_PATH="$chrome_path" npm run test:browser
